modLoader="javafml"
loaderVersion="["${forgeversion}",)"
issueTrackerURL="https://github.com/MrTroble/TCUtility/issues"
license="Apache License Version 2.0"

[[mods]]
modId="${modid}"
version="${version}"
displayName="${modname}"
displayURL="https://troblecodings.com/"
authors="${author}"
credits="German Immersive Railroading Community"
description="This mod adds a lot of new building and decorative blocks. You can easily add more due to Json-based blockregistration with contentpacks."

[[dependencies.${modid}]]
    modId="forge" 
    mandatory=true 
    versionRange="[${forgeversion},)" 
    ordering="NONE"
    side="BOTH"

[[dependencies.${modid}]]
    modId="minecraft"
    mandatory=true
    versionRange="[${mcversion}]"
    ordering="NONE"
    side="BOTH"
