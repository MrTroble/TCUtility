plugins {
    id 'net.minecraftforge.gradle' version '6.0.+'
    id 'com.gradleup.shadow' version '9.2.0+'
    id 'eclipse'
    id 'net.darkhax.curseforgegradle' version '1.3.+'
    id 'com.modrinth.minotaur' version '2.+'
}

group = project.mod_group
version = project.mod_version

base {
    archivesName = "${project.mod_name}-${project.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.java_version.toInteger())
}

sourceSets{
    main {
        java {
            srcDirs("contentPackLib/src")
        }
    }
}

minecraft {
    mappings channel: 'snapshot', version: '20191002-1.14.3'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                tcutility {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            mods {
                tcutility {
                    source sourceSets.main
                }
            }
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
}

processResources {
    // Asset-Format-Migration (1.12.2 -> 1.14.4): Original-JSONs unter
    // src/main/resources/ bleiben unveraendert, der Build-Output unter
    // build/resources/main/ wird per Pipeline aus buildSrc/ konvertiert
    // (Forge-Blockstates -> Vanilla-Format, Texture-Keys mit '#'-Prefix,
    // Generator-Models pro substituiertem Variant). Neue Migrationsschritte
    // landen in com.troblecodings.build.AssetMigrations und werden hier
    // einfach an die Pipeline angehangen.
    doLast {
        def pipeline = new com.troblecodings.build.AssetMigrationPipeline()
        pipeline.addAll(com.troblecodings.build.AssetMigrations.mc1_12_to_mc1_14())
        pipeline.run(destinationDir)
        pipeline.report.each { logger.info(it) }
        logger.lifecycle("[asset-migrate] applied ${pipeline.report.size()} resource transforms")
    }
}

jar {
    archiveClassifier.set("old")
}

shadowJar {
    archiveClassifier.set('')
    configurations = []
    relocate 'com.troblecodings.contentpacklib', "${project.group}.tcutility.shadow.contentpacklib"

    manifest {
        attributes([
            "Specification-Title": project.mod_name,
            "Specification-Vendor": "troblecodings",
            "Specification-Version": project.version,
            "Implementation-Title": project.mod_name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "troblecodings",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    from("changelog.md")
    from("LICENSE")
}

reobf {
    shadowJar {}
}

tasks.named("build") {
    dependsOn("reobfShadowJar")
}

tasks.register("publishCurseforge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    def key = System.getenv("CURSETOKEN")
    if (key == null)
        key = 'dev'
    apiToken = key
    def mainFile = upload(project.curseforge_project_id, reobfShadowJar)
    mainFile.changelog = file("changelog.md").text
    mainFile.changelogType = 'markdown'
    mainFile.releaseType = 'release'
    mainFile.addModLoader("${project.loader}")
    mainFile.addEnvironment("Client", "Server")
    mainFile.addGameVersion("${project.minecraft_version}")
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")

    projectId = project.modrinth_project_id

    versionNumber = project.version
    versionName = "${project.mod_name} ${project.version}"

    uploadFile = reobfShadowJar

    gameVersions = [project.minecraft_version]
    loaders = [project.loader]

    changelog = file("changelog.md").text
}

tasks.register("publishModrinth") {
    dependsOn("modrinth")
}
